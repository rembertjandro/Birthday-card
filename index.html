<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Happy Birthday lovelove 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Outfit:wght@300;500&display=swap" rel="stylesheet">
<style>
@property --c1{syntax:'<color>';inherits:true;initial-value:#ff8fb8}
@property --c2{syntax:'<color>';inherits:true;initial-value:#ffd27a}
@property --c3{syntax:'<color>';inherits:true;initial-value:#8f7bff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#120a1c;color:#fff;font-family:Outfit,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:--c1 1.4s,--c2 1.4s,--c3 1.4s}
.serif{font-family:Fraunces,Georgia,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif}
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;background:radial-gradient(circle at 50% 40%,#2a1540,#120a1c 70%)}
#bg i{position:absolute;width:70vmax;height:70vmax;filter:blur(70px);opacity:.55;animation:morph 14s ease-in-out infinite,drift 22s ease-in-out infinite alternate}
#bg i:nth-child(1){background:var(--c1);left:-20vmax;top:-20vmax}
#bg i:nth-child(2){background:var(--c2);right:-25vmax;top:10vh;animation-delay:-4s,-6s}
#bg i:nth-child(3){background:var(--c3);left:10vw;bottom:-35vmax;animation-delay:-8s,-3s}
@keyframes morph{0%,100%{border-radius:42% 58% 63% 37%/41% 44% 56% 59%}33%{border-radius:68% 32% 40% 60%/55% 62% 38% 45%}66%{border-radius:35% 65% 52% 48%/63% 36% 64% 37%}}
@keyframes drift{to{transform:translate(8vw,6vh) rotate(60deg)}}
/* intro */
#intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:1400px;overflow:hidden}
.scene{position:relative;width:min(66vw,290px);aspect-ratio:1 / 1.38;transform-origin:50% 50% 0;transform-style:preserve-3d;transition:transform 1.6s cubic-bezier(.7,0,.2,1)}
.scene.zoom{transform:scale(9)}
.card{--w:min(66vw,290px);width:var(--w);height:calc(var(--w)*1.38);position:relative;transform-style:preserve-3d;animation:float 5s ease-in-out infinite;transition:transform 1.2s cubic-bezier(.6,0,.2,1);cursor:pointer;outline:none}
.card:focus-visible{filter:drop-shadow(0 0 12px #fff9)}
@keyframes float{50%{translate:0 -10px}}
.card.tilt{transform:rotateX(8deg) rotateY(-14deg)}
.page,.cover,.cover .back{position:absolute;inset:0;border-radius:6px 18px 18px 6px}
.page{background:linear-gradient(135deg,#fff7e6,#ffe3ef);box-shadow:0 0 0 1px #fff4,0 30px 60px #0008;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;color:#7a2c55;font-size:clamp(20px,5vw,26px);transition:box-shadow 1.2s}
.open .page{box-shadow:0 0 80px 30px #ffd98a,0 0 220px 90px #ff8fb8aa}
.cover{transform-origin:left center;transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.6,0,.2,1)}
.open .cover{transform:rotateY(-172deg)}
.cover .front,.cover .back{position:absolute;inset:0;backface-visibility:hidden;border-radius:6px 18px 18px 6px}
.cover .front{background:linear-gradient(145deg,#ff9ec4,#ff6f9f 55%,#c84b8f);box-shadow:inset 6px 0 14px #0003,0 30px 60px #0008;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.cover .front::after{content:"";position:absolute;inset:10px;border:1.5px dashed #fff8;border-radius:4px 12px 12px 4px}
.cover .front h1{font-size:clamp(28px,8vw,40px);line-height:1.05;font-weight:600;text-shadow:0 2px 12px #0003}
.cover .front h1 em{display:block;font-weight:300;font-size:1.25em;background:linear-gradient(90deg,#fff,#ffe9a8,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover .front small{letter-spacing:.35em;font-size:11px;text-transform:uppercase;opacity:.9}
.cover .back{transform:rotateY(180deg);background:linear-gradient(225deg,#fff7e6,#ffd9e8);display:flex;align-items:center;justify-content:center}
.cake{position:relative;width:176px;height:184px;transform:rotateX(-12deg) rotateY(-20deg);transform-style:preserve-3d}
.cake::after{content:"";position:absolute;left:18px;right:18px;bottom:5px;height:18px;border-radius:50%;background:#823c6340;filter:blur(5px);transform:translateZ(-8px)}
.cake-tier{position:absolute;left:50%;height:38px;border-radius:8px 8px 5px 5px;transform:translateX(-50%);transform-style:preserve-3d;background:linear-gradient(90deg,#c65283,#f294b4 18%,#ffd4dc 52%,#e67fa6 78%,#bd477b);box-shadow:inset 0 6px #fff9,inset 0 -8px #a53c6d,0 8px 12px #81385a44}
.cake-tier::before{content:"";position:absolute;left:0;right:0;top:-10px;height:20px;border-radius:50%;background:linear-gradient(90deg,#f8aec7,#fff0ed 45%,#e989aa);box-shadow:inset 0 2px #fff9;transform:translateZ(2px)}
.cake-tier::after{content:"";position:absolute;top:9px;right:-10px;width:16px;height:30px;border-radius:0 8px 5px 0;background:linear-gradient(90deg,#d96e98,#a83d70);transform:rotateY(90deg);transform-origin:left center}
.cake-tier.base{bottom:20px;width:136px;height:48px}
.cake-tier.middle{bottom:65px;width:100px;height:42px}
.cake-tier.top{bottom:104px;width:68px;height:36px}
.cake-candle{position:absolute;z-index:2;left:calc(50% - 4px);top:4px;width:8px;height:32px;border-radius:4px;background:repeating-linear-gradient(135deg,#fff4e8 0 5px,#ff83aa 5px 9px);box-shadow:0 1px 4px #9a396766}
.cake-candle::before{content:"";position:absolute;left:1px;top:-15px;width:7px;height:12px;border-radius:50% 50% 50% 0;background:radial-gradient(ellipse at 65% 65%,#fff7b2 0 18%,#ffb33f 42%,#ff6b4b 75%);transform:rotate(-35deg);filter:drop-shadow(0 0 5px #ffb54e)}
.glass{position:relative;padding:16px 34px;border:1px solid #fff6;border-radius:99px;color:#fff;font:500 16px Outfit,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;letter-spacing:.12em;cursor:pointer;background:linear-gradient(135deg,#fff4,#fff1);backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);box-shadow:inset 0 1px 0 #fff9,inset 0 -8px 20px #fff1,0 12px 40px #0005;overflow:hidden;transition:transform .3s,box-shadow .3s}
.glass::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff7,transparent);transform:skewX(-20deg);animation:shine 3.5s infinite}
@keyframes shine{60%,100%{left:130%}}
.glass:hover{transform:translateY(-3px) scale(1.04);box-shadow:inset 0 1px 0 #fffb,0 18px 50px #ff8fb855}
.glass:active{transform:scale(.96)}
#intro.go .glass,#intro.go .em{opacity:0;pointer-events:none;transition:opacity .5s}
.em{position:absolute;font-size:clamp(30px,6vw,46px);cursor:pointer;user-select:none;z-index:3;animation:bob var(--d,4s) ease-in-out infinite;transition:opacity .4s}
.em.pop{animation:none;transform:scale(1.6);opacity:0;transition:transform .18s,opacity .18s}
@keyframes bob{50%{transform:translateY(-14px) rotate(8deg)}}
.bit{position:fixed;z-index:9;pointer-events:none;font-size:22px}
#flash{position:fixed;inset:0;z-index:20;background:radial-gradient(circle,#fff,#ffe3ef);opacity:0;pointer-events:none;transition:opacity 1s}
#flash.on{opacity:1}
.gift-trigger{position:fixed;z-index:12;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;place-items:center;width:58px;height:58px;border:1px solid #fff9;border-radius:50%;color:#fff;background:linear-gradient(135deg,#fff7,#ff9ec466);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);box-shadow:inset 0 1px #fff9,0 8px 28px #1a061f66;cursor:pointer;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(12px) scale(.85);transition:opacity .4s,visibility .4s,transform .4s}
.gift-trigger.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0) scale(1)}
.gift-trigger:hover{transform:translateY(-3px) scale(1.06)}
.gift-trigger svg{width:32px;height:32px;filter:drop-shadow(0 2px 3px #6c225a66)}
.gift-reveal{position:fixed;z-index:22;inset:0;display:grid;place-items:center;padding:24px;background:#17091dcc;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s,visibility .35s}
.gift-reveal.show{opacity:1;visibility:visible;pointer-events:auto}
.gift-card{position:relative;display:grid;justify-items:center;gap:4px;width:min(92vw,390px);padding:28px 22px 24px;border:0;border-radius:30px;background:linear-gradient(145deg,#ffffff26,#ffffff12);box-shadow:0 24px 70px #08030e80;text-align:center}
.gift-scene{position:relative;width:260px;height:260px;max-width:75vw}
.bouquet{position:absolute;z-index:1;left:50%;bottom:82px;width:225px;height:210px;overflow:visible;filter:drop-shadow(0 9px 12px #19071366);opacity:0;transform:translate(-50%,60px) scale(.35);transform-origin:50% 100%;cursor:pointer}
.gift-reveal.show .bouquet{animation:bouquet-rise 1.15s .35s cubic-bezier(.18,.85,.24,1) forwards}
.gift-reveal.show .bouquet.bounce{animation:bouquet-bounce .8s cubic-bezier(.28,.84,.42,1)}
.bouquet .stem{fill:none;stroke:#548754;stroke-width:5;stroke-linecap:round}
.bouquet .leaf{fill:#78ad72;stroke:#477d51;stroke-width:2}
.bouquet .wrap{fill:#f3bdd0;stroke:#fff2;stroke-width:2}
.bouquet .ribbon{fill:#d84b78}
.bouquet .flower-petal{stroke:#fff8;stroke-width:1}
.gift-box{position:absolute;z-index:2;left:50%;bottom:22px;width:126px;height:84px;transform:translateX(-50%);filter:drop-shadow(0 8px 12px #17061655)}
.gift-box-body{position:absolute;left:8px;right:8px;bottom:0;height:59px;border-radius:5px 5px 12px 12px;background:linear-gradient(90deg,#ba3c77,#f17da1 24%,#f8a9bb 53%,#dc5685);box-shadow:inset 0 -8px #a7356c44}
.gift-box-body::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:15px;transform:translateX(-50%);background:#ffe3a7c9}
.gift-box-lid{position:absolute;z-index:2;left:0;top:13px;width:126px;height:24px;border-radius:6px;background:linear-gradient(90deg,#d74c83,#ff9eba 45%,#d74c83);box-shadow:inset 0 3px #fff7;transform-origin:8px 100%}
.gift-box-lid::before,.gift-box-lid::after{content:"";position:absolute;bottom:19px;width:27px;height:20px;border:6px solid #ffe3a7;border-radius:80% 80% 10% 80%}
.gift-box-lid::before{left:34px;transform:rotate(24deg)}
.gift-box-lid::after{right:34px;transform:scaleX(-1) rotate(24deg)}
.gift-reveal.show .gift-box-lid{animation:gift-open .72s .12s cubic-bezier(.2,.8,.2,1) forwards}
.gift-copy{color:#fff;font:italic 500 24px Fraunces,Georgia,serif}
.gift-subcopy{margin-top:4px;color:#fffD;font:italic 400 16px Fraunces,Georgia,serif}
@keyframes gift-open{0%{transform:translateY(0) rotate(0)}65%{transform:translate(-42px,-70px) rotate(-28deg)}100%{transform:translate(-62px,-88px) rotate(-38deg)}}
@keyframes bouquet-rise{0%{opacity:0;transform:translate(-50%,65px) scale(.3)}65%{opacity:1;transform:translate(-50%,-22px) scale(1.05)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes bouquet-bounce{0%,100%{transform:translate(-50%,0) scale(1)}30%{transform:translate(-50%,-34px) scale(1.07,.94)}52%{transform:translate(-50%,0) scale(.95,1.06)}72%{transform:translate(-50%,-12px) scale(1.03,.98)}88%{transform:translate(-50%,0) scale(.99,1.01)}}
#fireworks{position:fixed;inset:0;z-index:1;width:100%;height:100%;opacity:0;pointer-events:none;transition:opacity .7s ease}
#fireworks.active{opacity:1}
/* main */
#main{position:fixed;inset:0;z-index:2;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;opacity:0;visibility:hidden;transition:opacity 1.2s;scrollbar-width:none}
#main::before{content:"";position:fixed;z-index:0;inset:clamp(10px,2.2vw,28px);pointer-events:none;border-radius:10px 26px 26px 10px;background:linear-gradient(90deg,#fff2 0%,#fff3 49.45%,#fff6 49.8%,#fff1 50.2%,#ffe6ef33 50.55%,#ffe6ef22 100%);box-shadow:inset 0 0 0 1px #fff4,inset 12px 0 28px #fff1,0 20px 80px #0002}
#main::-webkit-scrollbar{display:none}
#main.show{opacity:1;visibility:visible}
section{position:relative;z-index:1;height:100dvh;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:5vh 5vw;text-align:center}
.rv{opacity:0;transform:translate3d(0,3rem,0) scale(.96) rotateX(4deg);filter:blur(7px);transition:opacity .8s ease,transform 1s cubic-bezier(.22,1,.36,1),filter .8s ease}
section.in .rv{opacity:1;transform:translate3d(0,0,0) scale(1) rotateX(0);filter:none}
section.in .rv:nth-child(2){transition-delay:.15s}section.in .rv:nth-child(3){transition-delay:.3s}
h2{font-weight:300;font-size:clamp(34px,9vw,84px);line-height:1.05}
h2 b{font-weight:700;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c1));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:slide 5s linear infinite}
@keyframes slide{to{background-position:200%}}
.sub{opacity:.75;letter-spacing:.3em;text-transform:uppercase;font-size:12px}
.ph{position:relative;height:min(68dvh,640px);aspect-ratio:3/4;max-width:88vw;overflow:hidden;border-radius:38% 62% 48% 52%/45% 43% 57% 55%;box-shadow:0 0 0 1px #fff2,0 22px 60px #0006,0 0 60px -24px var(--c1);background:#120a1c;transition:border-radius 1.2s cubic-bezier(.22,1,.36,1),box-shadow 1s}
.ph.wide{aspect-ratio:4/3;height:auto;width:min(88vw,720px)}
.ph.strip{aspect-ratio:auto;height:min(72dvh,700px);animation:none;border-radius:26px}
.ph img{position:relative;z-index:0;width:100%;height:100%;object-fit:cover;display:block;opacity:.86;filter:saturate(.82) brightness(.9);transform:scale(1.15);transition:transform 1.5s cubic-bezier(.22,1,.36,1),filter 1s,opacity 1s}
.ph.strip img{object-fit:contain}
.ph::after{content:"";position:absolute;z-index:1;inset:30% 0 0;background:linear-gradient(180deg,transparent 0%,#120a1c38 38%,#120a1cce 100%);pointer-events:none}
.photo-note{position:absolute;z-index:2;right:6%;bottom:6%;left:6%;padding:0;color:#fff;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;font:italic 300 clamp(16px,4vw,22px) Fraunces,Georgia,serif;line-height:1.4;text-shadow:0 1px 8px #120a1caa}
section.in .ph{border-radius:26px;box-shadow:0 0 0 1px #fff3,0 24px 64px #0007,0 0 90px -20px var(--c1)}
section.in .ph img{transform:scale(1)}
@media(orientation:landscape) and (max-height:600px){
 section{gap:1.2vh;padding:2vh 5vw}
 .ph{height:min(76dvh,calc(100dvh - 48px));width:auto;max-width:88vw}
 .ph.wide{height:min(76dvh,calc(100dvh - 48px));width:auto;aspect-ratio:4/3}
 .ph.strip{height:min(80dvh,calc(100dvh - 40px));width:auto}
 .photo-note{right:4%;bottom:4%;left:4%;padding:0;font-size:clamp(12px,min(2.2vw,4dvh),16px);line-height:1.2}
}
.n{font-size:12px;letter-spacing:.4em;opacity:.7}
#ui{position:fixed;z-index:10;right:14px;top:50%;translate:0 -50%;display:flex;flex-direction:column;gap:10px;opacity:0;transition:opacity 1s 1s}
#ui.show{opacity:1}
#ui a{width:9px;height:9px;border-radius:9px;background:#fff6;cursor:pointer;transition:all .5s}
#ui a.on{height:28px;background:#fff}
#mute{position:fixed;z-index:10;left:18px;top:calc(18px + env(safe-area-inset-top,0px));padding:4px;border:0;border-radius:50%;color:#fff;background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;font-size:24px;line-height:1;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s,transform .2s}
#mute.show{opacity:1;pointer-events:auto}
#mute:hover{transform:scale(1.12)}
#mute:focus-visible{outline:2px solid #fff;outline-offset:4px}
#again{position:relative;top:auto;right:auto;align-self:center;margin:1rem auto 0;padding:12px 20px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s ease,visibility .45s ease,transform .3s,box-shadow .3s}
#again.show{opacity:1;visibility:visible;pointer-events:auto}
.scene.zoom .page span,.scene.zoom .cover .front>*{opacity:0;transition:opacity .2s ease-out}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body>
<div id="bg"><i></i><i></i><i></i></div>
<canvas id="fireworks" aria-hidden="true"></canvas>
<div id="intro">
 <div class="scene" id="scene"><div class="card" id="card" role="button" tabindex="0" aria-label="Open birthday card">

 </div></div>
</div>
<div id="main">

 <section data-p="7"><h2 class="serif rv">Here's to<br><b>another year</b></h2><p class="serif rv" style="font-size:clamp(18px,4vw,26px);opacity:.85">of us. I love you. 💖</p><button class="glass" id="again">OPEN IT AGAIN</button></section>
</div>

<button id="giftButton" class="gift-trigger" type="button" aria-label="Open your flower gift" aria-expanded="false"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 20h32v23H8z" fill="#ed729a" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><path d="M5 15h38v9H5z" rx="2" fill="#ff9db6" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><path d="M21 15h7v28h-7z" fill="#ffe6a5"/><path d="M24 15c-10 0-14-4-10-8 4-3 9 1 10 8Zm1 0c1-8 7-11 11-7 3 4-2 7-11 7Z" fill="none" stroke="#ffe6a5" stroke-width="3" stroke-linejoin="round"/></svg></button>

   <div class="gift-scene">

   <div class="gift-box"><div class="gift-box-body"></div><div class="gift-box-lid"></div></div>
  </div>
  <h2 class="gift-copy" id="giftTitle">A bouquet for you</h2>
  <p class="gift-subcopy" id="giftDescription">A little love, wrapped up just for you.</p>
 </div>
</div>
<audio id="a" loop preload="auto" src="Miguel - damned (Official Audio).mp3"></audio>
<script>
// Cache selected elements once so the page logic stays simple and readable.
const $=s=>document.querySelector(s),intro=$('#intro'),card=$('#card'),a=$('#a'),main=$('#main');
const pal=[['#ff8fb8','#ffd27a','#8f7bff'],['#ff7a9c','#ffb36b','#7b5cff'],['#6fd3ff','#b48cff','#ff8fb8'],['#ffb86b','#ff6f91','#6a8bff'],['#7bffc9','#6fb7ff','#ff9ed2'],['#ffe27a','#ff8f8f','#a98bff'],['#ff9ed2','#8fe3ff','#ffd27a'],['#ff8fb8','#ffd27a','#8f7bff']];
// Floating emoji decorations that sparkle and animate when clicked.
const E=['🎈','🎉','🎂','💖','✨','🎁','🌸','🍰','🎀','🦋'],pos=[[6,14],[84,10],[10,70],[86,66],[24,6],[70,84],[48,90],[92,38],[3,42],[62,5]];
function ac(){return window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)())}
function pop(){try{const c=ac(),n=c.createBufferSource(),b=c.createBuffer(1,2200,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4);n.buffer=b;const g=c.createGain();g.gain.value=.4;n.connect(g).connect(c.destination);n.start()}catch(e){} }
E.forEach((e,i)=>{const s=document.createElement('span');s.className='em';s.textContent=e;s.style.cssText=`left:${pos[i][0]}%;top:${pos[i][1]}%;--d:${3+Math.random()*3}s`;s.onclick=()=>{if(s.classList.contains('pop'))return;const r=s.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;pop();s.classList.add('pop');
 for(let k=0;k<14;k++){const b=document.createElement('span');b.className='bit';b.textContent=e;b.style.cssText=`left:${x}px;top:${y}px;font-size:${12+Math.random()*16}px`;document.body.append(b);const t=k/14*6.28+Math.random()*.5,D=60+Math.random()*120;b.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(t)*D}px),calc(-50% + ${Math.sin(t)*D+40}px)) scale(.2) rotate(${Math.random()*360}deg)`,opacity:0}],{duration:700+Math.random()*500,easing:'cubic-bezier(.1,.8,.3,1)'}).onfinish=()=>b.remove()}
 setTimeout(()=>s.classList.remove('pop'),2600)};intro.append(s)});
// tilt
addEventListener('pointermove',e=>{if(intro.classList.contains('go'))return;const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;card.style.transform=`rotateX(${8-y*14}deg) rotateY(${-14+x*22}deg)`});
card.style.transform='rotateX(8deg) rotateY(-14deg)';
// open
function openCard(){if(intro.classList.contains('go'))return;intro.classList.add('go');card.style.transform='rotateX(0) rotateY(0)';card.classList.add('open');
 a.currentTime=0;a.volume=0;a.play().catch(()=>{});let v=0;const f=setInterval(()=>{v=Math.min(1,v+.04);a.volume=v;if(v>=1)clearInterval(f)},120);
 setTimeout(()=>$('#scene').classList.add('zoom'),1500);
 setTimeout(()=>$('#flash').classList.add('on'),2700);
 setTimeout(()=>{intro.style.display='none';main.classList.add('show');$('#ui').classList.add('show');$('#mute').classList.add('show');$('#giftButton').classList.add('show');$('#flash').classList.remove('on');io.observe;go(0)},3800)}
card.onclick=openCard;
card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCard()}};
a.addEventListener('ended',()=>{a.currentTime=0;a.play()});
$('#mute').onclick=()=>{a.muted=!a.muted;$('#mute').textContent=a.muted?'🔇':'🔊';$('#mute').setAttribute('aria-label',a.muted?'Unmute audio':'Mute audio')};
// pages
const secs=[...document.querySelectorAll('section')],ui=$('#ui'),again=$('#again'),giftButton=$('#giftButton'),giftReveal=$('#giftReveal'),bouquet=$('.bouquet');
const fireworksCanvas=$('#fireworks'),fireworksCtx=fireworksCanvas.getContext('2d');
let fireworksActive=false,fireworksRaf=0,fireworksLastLaunch=0;
function setGiftOpen(open){giftReveal.classList.toggle('show',open);giftReveal.setAttribute('aria-hidden',String(!open));giftButton.setAttribute('aria-expanded',String(open));if(open){giftReveal.classList.remove('show');requestAnimationFrame(()=>{giftReveal.classList.add('show');bouquet.focus()})}else if(giftButton.classList.contains('show'))giftButton.focus();else card.focus()}
giftButton.onclick=()=>setGiftOpen(giftButton.getAttribute('aria-expanded')!=='true');
bouquet.onclick=()=>{bouquet.classList.remove('bounce');void bouquet.offsetWidth;bouquet.classList.add('bounce')};
bouquet.onanimationend=e=>{if(e.animationName==='bouquet-bounce'){bouquet.classList.remove('bounce');setGiftOpen(false)}};
bouquet.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setGiftOpen(false)}};
addEventListener('keydown',e=>{if(e.key==='Escape'&&giftButton.getAttribute('aria-expanded')==='true')setGiftOpen(false)});
const fireworksRockets=[],fireworksSparks=[];
function resizeFireworks(){const ratio=Math.min(devicePixelRatio||1,2);fireworksCanvas.width=Math.round(innerWidth*ratio);fireworksCanvas.height=Math.round(innerHeight*ratio);fireworksCtx.setTransform(ratio,0,0,ratio,0,0)}
addEventListener('resize',resizeFireworks);resizeFireworks();
function burstFirework(x,y,hue){const count=44+Math.floor(Math.random()*16);for(let i=0;i<count;i++){const angle=Math.PI*2*i/count+Math.random()*.08,speed=1.4+Math.random()*4.1;fireworksSparks.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:48+Math.random()*30,maxLife:78,hue,glint:Math.random()>.82})}}
function launchFirework(){const hue=330+Math.random()*105;fireworksRockets.push({x:innerWidth*(.12+Math.random()*.76),y:innerHeight+8,targetY:innerHeight*(.12+Math.random()*.4),vx:(Math.random()-.5)*1.1,vy:-6.5-Math.random()*2,hue})}
function drawFireworks(time){if(!fireworksActive)return;const ctx=fireworksCtx;ctx.clearRect(0,0,innerWidth,innerHeight);ctx.globalCompositeOperation='lighter';
 if(time-fireworksLastLaunch>720){launchFirework();fireworksLastLaunch=time}
 for(let i=fireworksRockets.length-1;i>=0;i--){const r=fireworksRockets[i];r.x+=r.vx;r.y+=r.vy;r.vy+=.025;ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-r.vx*2,r.y-r.vy*2);ctx.strokeStyle=`hsla(${r.hue},100%,80%,.9)`;ctx.lineWidth=2;ctx.stroke();if(r.y<=r.targetY||r.vy>=0){burstFirework(r.x,r.y,r.hue);fireworksRockets.splice(i,1)}}
 for(let i=fireworksSparks.length-1;i>=0;i--){const p=fireworksSparks[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.055;p.vx*=.99;p.life--;if(p.life<=0){fireworksSparks.splice(i,1);continue}const alpha=Math.min(1,p.life/14);ctx.beginPath();ctx.arc(p.x,p.y,p.glint?2.4:1.7,0,Math.PI*2);ctx.fillStyle=`hsla(${p.hue},100%,${p.glint?90:65}%,${alpha})`;ctx.fill()}
 ctx.globalCompositeOperation='source-over';fireworksRaf=requestAnimationFrame(drawFireworks)}
function startFireworks(){if(fireworksActive)return;fireworksActive=true;fireworksCanvas.classList.add('active');fireworksLastLaunch=0;fireworksRaf=requestAnimationFrame(drawFireworks)}
function stopFireworks(){fireworksActive=false;cancelAnimationFrame(fireworksRaf);fireworksRaf=0;fireworksRockets.length=0;fireworksSparks.length=0;fireworksCtx.clearRect(0,0,innerWidth,innerHeight);fireworksCanvas.classList.remove('active')}
const photoNotes=[
 'Every little moment with you is my favorite.',
 'You make ordinary days feel like magic.',
 'My favorite place will always be right beside you.',
 'I’m so grateful for every laugh and memory we share.',
 'Here’s to all the beautiful adventures still ahead.',
 'You make my whole world a little brighter.'
];
secs.filter(s=>s.querySelector('.ph')).forEach((s,i)=>{const note=document.createElement('p');note.className='photo-note';note.textContent=photoNotes[i];s.querySelector('.ph').append(note)});
secs.forEach((s,i)=>{const d=document.createElement('a');d.onclick=()=>s.scrollIntoView();ui.append(d)});
const dots=[...ui.children];
function go(i){const p=pal[i];['--c1','--c2','--c3'].forEach((k,j)=>document.documentElement.style.setProperty(k,p[j]));dots.forEach((d,j)=>d.classList.toggle('on',j==i));again.classList.toggle('show',i===secs.length-1);if(i===secs.length-1)startFireworks();else stopFireworks()}
const io=new IntersectionObserver(es=>es.forEach(e=>{e.target.classList.toggle('in',e.isIntersecting);if(e.isIntersecting)go(+e.target.dataset.p)}),{root:main,threshold:.6});
secs.forEach(s=>io.observe(s));
again.onclick=()=>{
 setGiftOpen(false);giftButton.classList.remove('show');stopFireworks();
 a.pause();a.currentTime=0;a.muted=false;a.volume=1;$('#mute').textContent='🔊';$('#mute').setAttribute('aria-label','Mute audio');
 main.scrollTop=0;main.classList.remove('show');ui.classList.remove('show');$('#mute').classList.remove('show');again.classList.remove('show');
 secs.forEach(s=>s.classList.remove('in'));dots.forEach(d=>d.classList.remove('on'));
 document.documentElement.style.setProperty('--c1',pal[0][0]);document.documentElement.style.setProperty('--c2',pal[0][1]);document.documentElement.style.setProperty('--c3',pal[0][2]);
 $('#flash').classList.remove('on');intro.style.display='flex';intro.classList.remove('go');card.classList.remove('open');$('#scene').classList.remove('zoom');card.style.transform='rotateX(8deg) rotateY(-14deg)';
};
</script></body></html>
